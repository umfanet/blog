baseURL = "https://umfanet.github.io/blog/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "안주현"
theme = "PaperMod"
timeZone = "Asia/Seoul"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 60

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "달리기, 일, 그 사이의 기록"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = false
  hideSummary = false
  disableSpecial1stPost = true
  comments = false

  [params.homeInfoParams]
    Title = "안주현"
    Content = "달리기, 일, 그 사이의 기록."

  [params.label]
    text = "안주현"

[menu]
  [[menu.main]]
    identifier = "running"
    name = "달리기"
    url = "/running/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "태그"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "archives"
    name = "전체"
    url = "/archives/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
